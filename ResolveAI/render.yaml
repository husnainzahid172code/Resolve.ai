# Render Blueprint: New -> Blueprint -> pick this repo. Secrets are entered in the dashboard (sync: false).
services:
  - type: web
    name: resolveai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.8-flash
      - key: DATA_SOURCE
        value: google_sheets
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/service_account.json
      - key: GMAIL_WEBHOOK_URL
        sync: false
      - key: GMAIL_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_DEMO_RECIPIENT
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
